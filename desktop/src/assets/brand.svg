  <!-- InputSwitch 品牌图标：is 字标。几何只有这一份，各尺寸 PNG / icns / ico 由
       tools/make-icons.py 从这里生成；改颜色只要改底下的 #2b3343 / #1c222d / #4ee0b5。

       字形是 Nunito (SIL OFL 1.1) weight 900 的真实轮廓，不是手画的曲线 —— 以前的
       版本用几段贝塞尔拼 s，上下两个弧圆心不同，接缝处的曲率突变在小尺寸下会变成
       毛边。字体轮廓自带连续的曲率过渡，i 和 s 也共用同一套度量。

       底板按 macOS 的图标网格：画布内缩 10.2%（104 px）、超椭圆指数 5.3、
       一道向下 8px / 模糊 7px / 30% 的投影。实测系统图标（备忘录、音乐、
       国际象棋、照片）都是这个规格，照搬才和它们在 Dock 里齐平。 -->
