<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44">
  <!-- 菜单栏模板图：只有 alpha 有意义，系统按明暗自动反色。
       这个尺寸放不下两个字母，取笔画最简的 i。
       比例照抄 App 图标的 i（点径 0.96 倍笔宽、点与杆间隔 0.41 倍、杆高 2.87 倍），
       只是把笔画收细，免得在菜单栏里糊成一个方块。 -->
  <g fill="#000">
    <circle cx="22" cy="8.55" r="3.94"/>
    <rect x="17.9" y="15.85" width="8.2" height="23.53" rx="4.1"/>
  </g>
</svg>
