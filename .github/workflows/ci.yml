# CI：四张检查面，push 和 PR 都跑。
# - linux 的纯库编译（--no-default-features：不拉 tao/wry，Linux 上不用装 gtk）
# - 面板 JS 的离线断言（panelcheck，node 直接跑）
# - macOS / Windows 的完整编译（--bins 含托盘与面板窗口）
# - macOS 的单元测试（这个套件要单线程跑，见 CONTRIBUTING）
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lib-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --lib --no-default-features

  panelcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/panelcheck.js assets/panel

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --bins
      - run: cargo test --lib -- --test-threads=1

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --bins
